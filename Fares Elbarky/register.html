<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&amp;display=swap" rel="stylesheet">
  
</head>
<body>
    <div class="background">
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    <form name="reg_form" onsubmit="return validateForm()">
        <h3>Register Here</h3>

        <label for="name" name="f-n">Full Name </label>
        <input type="text" placeholder="full name" id="username" name="f-n" required>
        <span class="error" id="usernameError"></span>

        <label for="Age" name="age">Age </label>
        <input type="date" placeholder="Age" id="age" name="age"required>

        <label for="email" name="email">Email</label>
        <input type="email" placeholder="Email" id="email" name="email" required>
        <span class="error" id="emailError"></span>

        <label for="password" name="password">Password</label>
        <input type="password" placeholder="Password" id="password" name="password" required>
        <span class="error" id="passwordError"></span>

        <label for="c-password" name="c-password">Confirm Password</label>
        <input type="password" placeholder="Confirm Password" id="c-password" name="cpassword" required>
        <span class="error" id="cpasswordError"></span>

        <button type="submit">Sign up </button>
        <div class="social">
            <div class="go"><i class="fab fa-google"></i> <a href="https://www.google.com/">Google</a></div>
            <div class="fb"><i class="fab fa-facebook"></i><a href="https://www.facebook.com/">Facebook</div>
        </div>
        <div class="reg">
            <a href="login.html" id="login">Login here</a>
        </div>
    </form>   
    <script src="style.js"></script>
    
</body>
</html>
